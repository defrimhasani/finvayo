<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#17221e" />
    <title>Reset password | Finvayo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/product.css" />
  </head>
  <body class="login-page">
    <a class="skip-link" href="#reset-main">Skip to password reset</a>
    <header class="login-header"><a class="wordmark" href="/" aria-label="Finvayo home"><svg aria-hidden="true" viewBox="0 0 32 32"><path d="M5 24V8h22M8 20l5-5 4 3 8-9" /></svg>Finvayo</a><a class="login-help" href="/login">Back to sign in</a></header>
    <main class="login-layout" id="reset-main">
      <section class="login-intro"><p class="eyebrow">Secure reset</p><h1>Choose a new password.</h1><p>Your reset link works once and expires after one hour.</p></section>
      <section class="login-panel" aria-labelledby="reset-title">
        <p class="panel-count">02 / New password</p><h2 id="reset-title">Secure your account.</h2>
        <p class="panel-copy">Use at least 12 characters that you do not use elsewhere.</p>
        <div class="form-alert" id="form-alert" role="alert" hidden></div>
        <form class="login-form" action="/auth/reset-password" method="post">
          <input name="token" type="hidden" value="{{TOKEN}}" />
          <label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
          <label for="password-confirmation">Confirm new password</label><input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
          <button class="button button-primary" type="submit">Reset password <span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
    <footer class="login-footer"><p>© 2026 Finvayo</p><p>Planning estimates, not financial advice.</p></footer>
    <script>
      if (new URLSearchParams(window.location.search).get("error") === "invalid") { const alert = document.getElementById("form-alert"); alert.textContent = "Passwords must match and contain at least 12 characters."; alert.hidden = false; }
    </script>
  </body>
</html>
